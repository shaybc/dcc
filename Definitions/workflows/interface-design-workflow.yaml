name: Interface Design Workflow
dcc_uri: dev/workflows/interface-design-workflow
description: End-to-end interface-design workflow from domain exploration through craft validation and pattern capture.
schema: v1
steps:
  - id: check-project-system
    description: Read `.interface-design/system.md` if it exists and treat it as the source of project decisions.
  - id: domain-exploration
    description: Produce required outputs (domain concepts, color world, signature element, defaults to reject) before proposing direction.
  - id: propose-direction
    description: Propose direction that references all required exploration outputs and replacement choices for defaults.
  - id: confirm-direction
    description: Confirm direction with the user before implementation.
  - id: design-implementation
    description: Build with consistent token architecture, spacing system, depth strategy, hierarchy, and interaction states.
  - id: run-craft-checks
    description: Apply swap, squint, signature, and token checks; iterate if any check fails.
  - id: offer-save
    description: Offer to save patterns for future sessions and persist decisions to `.interface-design/system.md` when approved.
