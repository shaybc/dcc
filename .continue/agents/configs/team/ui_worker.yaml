name: UI Worker
version: 1.0.0
schema: v1
description: this configuration bundles all the UI related prompts, rules and
  context to allow easier developer-to-AI interaction on UI tasks.
models:
  - name: Gemini 2.5 Flash
    provider: openai
    model: gemini-2.5-flash
    apiBase: http://localhost:7331/v1
    roles:
      - chat
      - edit
      - apply
      - summarize
context:
  - provider: clipboard
  - provider: code
  - provider: currentFile
  - provider: debugger
    params:
      - key: stackDepth
        value: "3"
  - provider: file
  - provider: open
    params:
      - key: onlyPinned
        value: "true"
  - provider: terminal
rules:
  - name: Dev Core Rules
    alwaysApply: true
    rule: >-
      # Core development Rules

      These rules apply to all projects (web/mobile/backend/devops etc).


      ## 1) Small, Focused Changes

      - Prefer small, correct, maintainable changes.

      - MUST keep PRs/changesets focused on one goal.

      - MUST avoid unrelated refactors in the same change.

      - MUST delete dead code and unused exports touched by the change.


      ## 2) Readability & Maintainability

      - MUST use clear names; avoid cleverness.

      - MUST keep functions/modules small and single-purpose.

      - MUST avoid magic numbers/strings (use constants/enums).

      - MUST add comments only for “why”, not “what”.


      ## 3) Error Handling

      - MUST not swallow errors silently.

      - MUST return/throw consistent error types within a module.

      - MUST keep public APIs stable; breaking changes require migration notes.


      ## 4) Testing Discipline

      - MUST add/update tests for new behavior.

      - MUST add a regression test for every bug fix (when feasible).


      ## 5) Determinism & Reproducibility

      - MUST ensure builds are reproducible (lockfiles committed where
      relevant).

      - MUST avoid reliance on local machine state.

      - MUST document required env/config in README or docs.


      ## 6) Performance Hygiene

      - MUST avoid obvious O(n²) or unbounded loops on user-sized inputs.

      - MUST avoid expensive work in hot paths without caching/limits.

      - MUST measure before “optimizing” (add a benchmark or profiling note when
      relevant).


      ## 7) Dependency Hygiene

      - MUST remove unused dependencies.

      - MUST not introduce large dependencies without justification.

      - MUST pin/lock dependency versions per ecosystem norms.


      ## 8) Logging & Debuggability

      - SHOULD add basic metrics/tracing hooks for critical paths (latency,
      errors, queue depth, retries).

      - MUST keep logs actionable (what happened + context).

      - SHOULD include correlation/request IDs where applicable.

      - MUST not spam logs in tight loops.


      ## 9) Documentation & Developer Experience

      - MUST update docs when behavior/config changes.

      - MUST keep examples and scripts runnable.

      - MUST include a clear “how to run/test locally” path.

      - Optional document changes in changelog or release notes.

      - SHOULD include rollback notes when change is risky.


      ## 10) Configuration

      - MUST keep config keys centralized (single source of truth).

      - MUST include defaults only when safe; otherwise fail fast.

      - MUST document config schema (names, types, examples).


      ## 11) Migrations and Backwards Compatibility

      - MUST treat schema/config/protocol changes as migrations (forward +
      rollback/compat plan).

      - MUST avoid breaking changes without a migration path.


      ## 12) Stability & Contracts

      - MUST define and keep stable contracts between components (API schemas,
      events, interfaces).

      - MUST treat contract changes as breaking unless explicitly versioned or
      migrated.

      - MUST update all consumers when modifying shared interfaces.

      - MUST keep backward compatibility during transitions (deprecate before
      removal).

      - MUST document contract expectations (inputs, outputs, invariants).

      - MUST avoid implicit behavior changes in shared modules.


      ## 13) Output Expectation

      - Prefer minimal diffs.

      - If multiple approaches exist: pick one, state tradeoffs briefly.

      - Provide a short test plan (commands + what to verify).
  - name: CSRF Protection
    globs:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
    rule: |-
      # CSRF Protection

      All state-changing requests must be CSRF-protected.

      - MUST protect POST, PUT, PATCH, DELETE routes.
      - MUST validate double-submit token.
      - MUST use constant-time comparison.
      - MUST generate tokens with ≥32 bytes entropy.
  - name: File Upload Validation
    globs:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
    rule: |-
      # File Upload Validation

      All uploads must be validated at the boundary.

      - MUST enforce size limits.
      - MUST enforce MIME allowlist.
      - MUST enforce extension allowlist.
      - SHOULD verify file signature (magic bytes).
      - MUST reject invalid files before storage.
  - name: JWT Strict Config
    globs:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
    rule: |-
      # JWT Strict Configuration

      JWT usage must be strict and explicit.

      - MUST set explicit `algorithm` when signing.
      - MUST set explicit `expiresIn`.
      - MUST verify with `algorithms` allowlist.
      - MUST validate `issuer` and `audience`.
      - MUST NOT disable expiration validation.
  - name: No Error Leakage
    globs:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
    rule: |-
      # Error Handling

      Errors must not leak internal information.

      - MUST NOT return `error.message` or `error.stack`.
      - MUST log full details server-side.
      - MUST use generic user-facing messages.
      - MUST prevent user enumeration in auth flows.
  - name: Angular Base Rules
    alwaysApply: false
    rule: "# Angular Rules (v19+)\r

      These rules apply to all Angular projects and extend the core and
      frontend-core rules.\r

      \r

      ## 1) Components\r

      - MUST use `input()`, `output()`, and `model()` signals instead of
      `@Input()` / `@Output()` decorators.\r

      - MUST default to `ChangeDetectionStrategy.OnPush` on every component.\r

      - MUST prefer standalone components; avoid NgModules unless integrating
      legacy code.\r

      - MUST not use `ngOnChanges` to react to input changes — use `effect()` or
      `computed()` on signal inputs instead.\r

      - MUST keep templates logic-free: move conditions and transformations into
      the component class or a `computed()`.\r

      \r

      ## 2) Signals & Reactivity\r

      - MUST use signals (`signal()`, `computed()`, `effect()`) as the default
      reactivity primitive.\r

      - MUST not write to a signal inside `computed()` — computed values are
      derived, not side effects.\r

      - MUST scope `effect()` to a reactive context (component/directive); avoid
      creating effects in services unless clearly justified.\r

      - MUST clean up effects and subscriptions that are not automatically
      managed (e.g. manual `effect()` refs).\r

      - SHOULD prefer `computed()` over manual `effect()` when the goal is
      deriving a value.\r

      \r

      ## 3) RxJS\r

      - MUST use RxJS only for inherently async/event-driven flows (HTTP,
      WebSockets, complex event streams); prefer signals for local/UI state.\r

      - MUST use `takeUntilDestroyed()` (from `@angular/core/rxjs-interop`) for
      subscription cleanup; avoid manual `Subject`/`takeUntil` teardown
      patterns.\r

      - MUST avoid `subscribe()` inside `subscribe()` — use `switchMap` /
      `mergeMap` / `concatMap` as appropriate.\r

      - MUST choose the correct flattening operator: `switchMap` for cancellable
      (e.g. search), `concatMap` for ordered, `mergeMap` for parallel,
      `exhaustMap` for non-interruptible (e.g. form submit).\r

      - MUST not use `async` pipe and manual `subscribe()` for the same stream
      in the same component.\r

      \r

      ## 4) Services & Dependency Injection\r

      - MUST use `providedIn: 'root'` for singleton services; use
      component/route-level providers only when explicit scoping is needed.\r

      - MUST use the `inject()` function instead of constructor injection in new
      code.\r

      - MUST not perform side effects (HTTP calls, subscriptions) in a service
      constructor — use explicit init methods or lazy patterns.\r

      \r

      ## 5) Routing\r

      - MUST use lazy-loaded routes (`loadComponent` / `loadChildren`) for all
      feature areas.\r

      - MUST use route-level resolvers or `ResolveFn` to load data before
      navigation; avoid loading data inside `ngOnInit` triggered by route
      activation.\r

      - MUST use typed router params (`withComponentInputBinding()`) instead of
      manually injecting `ActivatedRoute` where possible.\r

      \r

      ## 6) Forms\r

      - MUST use Reactive Forms for any form with validation, multi-field
      interaction, or dynamic fields.\r

      - MUST use Template-driven forms only for simple, single-field, low-stakes
      inputs.\r

      - MUST type `FormControl<T>` explicitly; avoid untyped form APIs
      (`UntypedFormControl` etc.) in new code.\r

      - MUST not put form logic (validation, submission) in the template — keep
      it in the component class.\r

      \r

      ## 7) Performance\r

      - MUST use `@defer` blocks for components that are not needed on initial
      render.\r

      - MUST use `trackBy` (or the `track` expression in `@for`) on all list
      renders.\r

      - MUST not call functions in templates that are not pure/memoized — use
      `computed()` or pipes instead.\r

      - MUST use `NgOptimizedImage` for all `<img>` elements where applicable."
  - name: Node.js Rules
    rule: >-
      # Node.js Rules (Node 20+ LTS)


      These rules apply to all Node.js backend projects and extend the core and
      backend-core rules.


      ---


      ## Language & Style


      - Use ES Modules (`import` / `export`) for all new projects. Use CommonJS
      (`require` / `module.exports`) only when the project or a dependency
      requires it — do not mix both in the same project.

      - Use `async/await` for all asynchronous code. Do not introduce new
      callback-based APIs or raw `.then()/.catch()` chains unless integrating
      with a library that requires it.

      - Prefer `const` over `let`; never use `var`.

      - Use strict equality (`===`) everywhere. Never use `==`.

      - Prefer plain functions and objects over classes unless a framework
      explicitly requires class syntax (e.g. NestJS decorators).

      - Avoid deeply nested callbacks or promise chains — flatten with
      `async/await` and early returns.


      ---


      ## Error Handling


      - Every `async` function that can fail must have explicit error handling.
      Never let a rejected promise go unhandled.

      - Distinguish error types at the boundary: validation errors (400), not
      found (404), auth failures (401/403), and unexpected errors (500). Do not
      map everything to 500.

      - Never expose internal error details, stack traces, or file paths in API
      responses. Log them server-side; return a safe message to the caller.

      - Use a centralised error handling middleware in Express rather than
      try/catch-to-response in every route handler. Route handlers should throw
      or pass errors to `next(err)`.

      - Do not swallow errors silently with empty `catch` blocks. At minimum,
      log and rethrow.


      ---


      ## Async & Concurrency


      - Never use `await` inside a `for` loop when the operations are
      independent — use `Promise.all()` to run them concurrently.

      - Never block the event loop with synchronous I/O (`fs.readFileSync`,
      `execSync`, etc.) in request handlers or hot paths. Use the async
      equivalents.

      - Set explicit timeouts on all outbound HTTP calls. A call with no timeout
      can block a request handler indefinitely.

      - Use Node's `AbortController` to cancel in-flight requests when the
      caller disconnects or a timeout is reached.


      ---


      ## Project Structure


      - One responsibility per file. A file that exports a router, defines
      business logic, and talks to the database has too many responsibilities.

      - Group by feature, not by layer. Prefer `features/users/` containing its
      router, service, and data access over top-level `routes/`, `controllers/`,
      `models/` folders that scale poorly.

      - Keep framework-specific code (Express routers, middleware) separate from
      business logic. Business logic must be callable without an HTTP context —
      this is what makes it testable.

      - Entry point (`app.js` / `index.js`) wires the application together — it
      must not contain business logic or route definitions.


      ---


      ## Configuration & Secrets


      - All configuration comes from environment variables. Use a single
      centralised config module that reads from `process.env`, validates
      required values on startup, and fails fast if any are missing.

      - Never access `process.env.VARIABLE` directly outside the config module —
      this scatters assumptions about env shape across the codebase.

      - Never commit `.env` files. Commit a `.env.example` with all required
      keys and safe placeholder values.


      ---


      ## Dependencies


      - Do not install a package for something Node's standard library handles
      well (`fs/promises`, `crypto`, `path`, `URL`). Check built-ins first.

      - Do not introduce a new dependency without checking: is it actively
      maintained, does it have a reasonable install size, and does it have known
      vulnerabilities (`npm audit`)?

      - Pin exact versions in `package.json` for application code. Use lockfile
      (`package-lock.json`) committed to version control — never delete or
      ignore it.

      - Use `npm ci` in CI/CD pipelines, not `npm install`.
prompts:
  - name: Generic Write Test
    description: Generate tests for backend logic, services, or API handlers
    prompt: >-
      Generate tests for the selected backend code.


      Cover in this order:

      1. **Happy path** — valid input, expected output/side effect

      2. **Validation failures** — missing fields, bad types, out-of-range
      values

      3. **Not found / empty** — resource doesn't exist, empty result set

      4. **External failure** — downstream service/DB throws or times out

      5. **Idempotency** (if applicable) — calling twice produces the same
      result


      Rules:

      - Unit tests for pure logic and service methods — mock external
      dependencies

      - Integration tests for persistence and protocol boundaries — use real
      DB/containers, not in-memory fakes that differ from production

      - Each test has a single clear assertion focus

      - Name tests: `should [expected outcome] when [condition]`

      - Do not test framework behaviour — test your code's response to it

      - Every bug fix warrants a regression test that would have caught it
  - name: Angular Code Review
    description: Review Angular code against project-specific rules
    prompt: >-
      Review the selected Angular code. Apply our core, frontend-core, and
      Angular-specific rules.


      Check specifically for:


      **Angular correctness**

      - `@Input()`/`@Output()` decorators used instead of `input()`/`output()`
      signals

      - Missing `ChangeDetectionStrategy.OnPush`

      - NgModule usage where standalone should be used

      - `ngOnChanges` used to react to inputs instead of `effect()` or
      `computed()`

      - Logic or data fetching inside the template or `constructor`


      **Reactivity**

      - State stored in plain properties instead of `signal()`

      - Derived values stored in state instead of `computed()`

      - Writing to a signal inside `computed()`

      - RxJS used where a `computed()` or `signal()` would be simpler and
      sufficient


      **RxJS (where used)**

      - Missing `takeUntilDestroyed()` on subscriptions

      - Wrong flattening operator for the use case (e.g. `mergeMap` on a form
      submit that should be `exhaustMap`)

      - Nested `subscribe()` calls


      **Performance**

      - Function calls in templates that are not memoised via `computed()` or
      pipe

      - Missing `trackBy` / `track` on list renders

      - Missing `@defer` on heavy components not needed on initial render


      Format: Critical → Important → Minor. Be direct.
docs:
  - name: Angular
    startUrl: https://angular.dev/overview
  - name: Node.js API
    startUrl: https://nodejs.org/docs/latest-v20.x/api/index.html
mcpServers:
  - name: Memory
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-memory"
  - name: Browser MCP
    command: npx
    args:
      - -y
      - "@browsermcp/mcp@latest"
  - name: Playwright
    command: npx
    args:
      - -y
      - "@executeautomation/playwright-mcp-server"
  - name: Filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - ${{ inputs.PATH }}
