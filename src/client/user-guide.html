<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <style>
      html body a {
        color: #009ccc;
        text-decoration: none;
      }

      .help-guide-page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 18px 20px 44px;
      }

      .help-guide-topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .help-guide-layout {
        display: grid;
        grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
        gap: 24px;
      }

      .help-guide-toc {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-soft);
        padding: 14px;
        align-self: start;
        position: sticky;
        top: 12px;
      }

      .help-guide-toc h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .toc-section + .toc-section {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .toc-section-header {
        all: unset;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        box-sizing: border-box;
        cursor: pointer;
        border-radius: 8px;
        padding: 4px 6px;
      }

      .toc-section-header:hover,
      .toc-section-header:focus-visible {
        background: var(--surface-hover);
        outline: none;
      }

      .toc-section-title {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
      }

      .toc-section-chevron {
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        transition: transform 0.2s ease;
      }

      .toc-section.is-collapsed .toc-section-chevron {
        transform: rotate(-90deg);
      }

      .toc-section-body {
        margin-top: 8px;
      }

      .toc-section.is-collapsed .toc-section-body {
        display: none;
      }

      .toc-links {
        display: grid;
        gap: 6px;
      }

      .toc-sub-links {
        display: grid;
        gap: 5px;
        margin: 2px 0 8px 14px;
        padding-left: 10px;
        border-left: 1px solid var(--border);
      }

      .toc-link {
        display: block;
        color: var(--text);
        text-decoration: none;
        border-radius: 8px;
        padding: 8px 10px;
      }

      .toc-link:hover,
      .toc-link:focus-visible {
        background: var(--surface-hover);
        outline: none;
      }

      .toc-link.is-active {
        background: var(--surface-hover);
        border: 1px solid var(--border);
        padding: 7px 9px;
      }

      .toc-sub-link {
        font-size: 0.92rem;
      }

      .help-guide-content {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-soft);
        padding: 20px;
        min-height: 520px;
      }

      .help-guide-status {
        margin-top: 0;
        margin-bottom: 12px;
        color: var(--muted);
      }

      .md-content h1,
      .md-content h2,
      .md-content h3 {
        margin-top: 24px;
        margin-bottom: 10px;
      }

      .md-content h1 {
        color: var(--md-h1-color);
      }

      .md-content h2 {
        color: var(--md-h2-color);
      }

      .md-content h3 {
        color: var(--md-h3-color);
      }

      .md-content h4 {
        color: var(--md-h4-color);
      }

      .md-content h5 {
        color: var(--md-h5-color);
      }

      .md-content h6 {
        color: var(--md-h6-color);
      }

      .md-content h1 {
        margin-top: 0;
      }

      .md-content p,
      .md-content ul,
      .md-content ol,
      .md-content hr {

        margin-bottom: 12px;
        line-height: 1.5;

        color: #17202f;
      }

        background: #edf2f8;

        border: 1px solid #d6deea;

        display: block;

        padding: 0;

        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;

      const pagesById = new Map(
        tocSections.flatMap((section) => section.pages.flatMap((page) => {
          const pageEntries = [[page.id, page]];
          if (Array.isArray(page.children)) {
            pageEntries.push(...page.children.map((child) => [child.id, child]));
          }
          return pageEntries;
        }))
      );

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderInline(text, baseDir) {
        const escaped = escapeHtml(text);
        const codeSegments = [];
        const withCodePlaceholders = escaped.replace(/(`{1,3})([^\n]+?)\1/g, (_match, _ticks, code) => {
          const placeholder = `%%CODE${codeSegments.length}%%`;
          codeSegments.push(`<code>${code}</code>`);
          return placeholder;
        });

        const withQuotedToken = withCodePlaceholders.replace(/&#39;([^<>&\n]+?)&#39;/g, '<span class="md-inline-quoted">$1</span>');
        const withEmoji = withQuotedToken.replace(/:([a-z0-9_+-]+):/gi, (_match, shortcode) => {
          const emoji = EMOJI_SHORTCODE_MAP.get(String(shortcode || "").toLowerCase());
          return emoji || _match;
        });
        const withUnderline = withEmoji.replace(/__([^_]+)__/g, "<u>$1</u>");
        const withBold = withUnderline.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        const withItalic = withBold.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        const withStrikethrough = withItalic.replace(/~~([^~]+)~~/g, "<del>$1</del>");
        const withHighlight = withStrikethrough.replace(/==([^=]+)==/g, "<mark>$1</mark>");
        const withSubscript = withHighlight.replace(/~([^~<>\n]+)~/g, "<sub>$1</sub>");
        const withSuperscript = withSubscript.replace(/\^([^\^<>\n]+)\^/g, "<sup>$1</sup>");
        const withFootnoteRefs = withSuperscript.replace(/\[\^([^\]]+)\]/g, (_match, id) => `<sup id="fnref-${id}"><a href="#fn-${id}">[${id}]</a></sup>`);
        const withLinks = withFootnoteRefs.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
          const resolved = resolvePath(href, baseDir);
          const safeHref = escapeHtml(resolved);
          return `<a href="${safeHref}" target="_blank" rel="noopener">${label}</a>`;
        });

        return withLinks.replace(/%%CODE(\d+)%%/g, (_match, index) => codeSegments[Number(index)] || "");
      }


      function slugifyHeadingId(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/<[^>]*>/g, "")
          .replace(/[^a-z0-9\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }

      function renderTaskListItem(text, baseDir) {
        const taskMatch = text.match(/^\[(x| )\]\s+(.+)$/i);
        if (!taskMatch) {
          return renderInline(text, baseDir);
        }

        const checked = taskMatch[1].toLowerCase() === "x";
        const label = renderInline(taskMatch[2], baseDir);
        return `<label class="md-task-item"><input type="checkbox" disabled ${checked ? "checked" : ""} /> ${label}</label>`;
      }

      function renderTable(tableRows, baseDir) {
        if (tableRows.length < 2) return "";
        const parseCells = (line) => line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());

        const headerCells = parseCells(tableRows[0]);
        const alignRow = parseCells(tableRows[1]);
        const bodyRows = tableRows.slice(2).map(parseCells);
        const isDivider = alignRow.length === headerCells.length && alignRow.every((cell) => /^:?-{3,}:?$/.test(cell));
        if (!isDivider) return "";

        const thead = `<thead><tr>${headerCells.map((cell) => `<th>${renderInline(cell, baseDir)}</th>`).join("")}</tr></thead>`;
        const tbody = `<tbody>${bodyRows.map((row) => `<tr>${headerCells.map((_, idx) => `<td>${renderInline(row[idx] || "", baseDir)}</td>`).join("")}</tr>`).join("")}</tbody>`;
        return `<table>${thead}${tbody}</table>`;
      }

      const EMOJI_SHORTCODE_MAP = new Map([
        ["joy", "😂"],
        ["smile", "😄"],
        ["rocket", "🚀"],
        ["warning", "⚠️"],
        ["white_check_mark", "✅"],
        ["x", "❌"]
      ]);

      function resolvePath(pathValue, baseDir) {
        if (/^(https?:)?\/\//.test(pathValue) || pathValue.startsWith("/")) {
          return pathValue;
        }
        const normalizedBase = baseDir.endsWith("/") ? baseDir.slice(0, -1) : baseDir;
        return `${normalizedBase}/${pathValue}`;
      }

      function highlightCode(source, language) {
        const escaped = escapeHtml(source);
        if (!["yaml", "yml", "json"].includes((language || "").toLowerCase())) {
          return escaped;
        }

        return escaped
          .replace(/(^|\s)(true|false|null)(?=\s|$|[\],}])/gm, "$1<span class=\"md-code-boolean\">$2</span>")
          .replace(/(^|\s)(-?\d+(?:\.\d+)?)(?=\s|$|[\],}])/gm, "$1<span class=\"md-code-number\">$2</span>")
          .replace(/("(?:\\.|[^"])*"|'(?:\\.|[^'])*')/g, "<span class=\"md-code-string\">$1</span>")
          .replace(/(^\s*#.*$)/gm, "<span class=\"md-code-comment\">$1</span>")
          .replace(/(^\s*[\w.-]+)(\s*:)/gm, "<span class=\"md-code-key\">$1</span>$2");
      }

      function renderCodeBlock(codeLines, language) {
        const lang = escapeHtml((language || "").toLowerCase());
        const source = codeLines.join("\n");
        const highlighted = highlightCode(source, language);
        return `<pre class="md-code-block"><code class="language-${lang}">${highlighted}</code></pre>`;
      }

      function markdownToHtml(markdown, markdownPath) {
        const baseDir = markdownPath.includes("/")
          ? `${HELP_PAGES_BASE}/${markdownPath.slice(0, markdownPath.lastIndexOf("/"))}`
          : HELP_PAGES_BASE;

        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let paragraphBuffer = [];
        let listType = null;
        let codeFenceLanguage = null;
        let codeFenceLines = [];
        let blockquoteLines = [];
        let tableRows = [];
        let pendingDefinitionTerm = null;
        const footnotes = [];

        function flushParagraph() {
          if (!paragraphBuffer.length) return;
          const paragraphText = paragraphBuffer.join(" ").trim();
          if (paragraphText) {
            html.push(`<p>${renderInline(paragraphText, baseDir)}</p>`);
          }
          paragraphBuffer = [];
        }

        function closeList() {
          if (!listType) return;
          html.push(listType === "ol" ? "</ol>" : "</ul>");
          listType = null;
        }

        function flushBlockquote() {
          if (!blockquoteLines.length) return;
          const content = blockquoteLines.map((quoteLine) => renderInline(quoteLine, baseDir)).join("<br />");
          html.push(`<blockquote>${content}</blockquote>`);
          blockquoteLines = [];
        }

        function flushTable() {
          if (!tableRows.length) return;
          const tableHtml = renderTable(tableRows, baseDir);
          if (tableHtml) {
            html.push(tableHtml);
          } else {
            const rowText = tableRows.join(" ").trim();
            if (rowText) {
              html.push(`<p>${renderInline(rowText, baseDir)}</p>`);
            }
          }
          tableRows = [];
        }

        function flushPendingTermAsParagraph() {
          if (!pendingDefinitionTerm) return;
          paragraphBuffer.push(pendingDefinitionTerm);
          pendingDefinitionTerm = null;
        }

        function closeAllOpenBlocks() {
          flushPendingTermAsParagraph();
          flushParagraph();
          closeList();
          flushBlockquote();
          flushTable();
          pendingDefinitionTerm = null;
        }

        for (const rawLine of lines) {
          const line = rawLine.trim();

          if (codeFenceLanguage !== null) {
            if (line.startsWith("```")) {
              html.push(renderCodeBlock(codeFenceLines, codeFenceLanguage));
              codeFenceLanguage = null;
              codeFenceLines = [];
            } else {
              codeFenceLines.push(rawLine);
            }
            continue;
          }

          const footnoteDefinitionMatch = line.match(/^\[\^([^\]]+)\]:\s+(.+)$/);
          if (footnoteDefinitionMatch) {
            closeAllOpenBlocks();
            footnotes.push({ id: footnoteDefinitionMatch[1], text: footnoteDefinitionMatch[2] });
            continue;
          }

          const codeFenceMatch = line.match(/^```\s*([\w-]+)?\s*$/);
          if (codeFenceMatch) {
            closeAllOpenBlocks();
            codeFenceLanguage = codeFenceMatch[1] || "";
            codeFenceLines = [];
            continue;
          }

          const tableMatch = rawLine.includes("|") && /^\s*\|?.+\|.+\|?\s*$/.test(rawLine);
          if (tableMatch) {
            flushPendingTermAsParagraph();
            flushParagraph();
            closeList();
            flushBlockquote();
            tableRows.push(rawLine);
            continue;
          }
          flushTable();

          const blockquoteMatch = rawLine.match(/^\s*>\s?(.*)$/);
          if (blockquoteMatch) {
            flushPendingTermAsParagraph();
            flushParagraph();
            closeList();
            blockquoteLines.push(blockquoteMatch[1]);
            continue;
          }
          flushBlockquote();

          const definitionMatch = rawLine.match(/^\s*:\s+(.+)$/);
          if (definitionMatch && pendingDefinitionTerm) {
            flushParagraph();
            closeList();
            flushBlockquote();
            flushTable();
            html.push(`<dl><dt>${renderInline(pendingDefinitionTerm, baseDir)}</dt><dd>${renderInline(definitionMatch[1], baseDir)}</dd></dl>`);
            pendingDefinitionTerm = null;
            continue;
          }

          if (!line) {
            closeAllOpenBlocks();
            continue;
          }

          flushPendingTermAsParagraph();

          const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
          if (headingMatch) {
            closeAllOpenBlocks();
            const level = headingMatch[1].length;
            const headingText = headingMatch[2].trim();
            const headingIdMatch = headingText.match(/^(.*)\s+\{#([a-zA-Z][\w-]*)\}\s*$/);
            const headingLabel = headingIdMatch ? headingIdMatch[1].trim() : headingText;
            const headingId = headingIdMatch ? headingIdMatch[2] : slugifyHeadingId(headingLabel);
            const idAttribute = headingId ? ` id="${escapeHtml(headingId)}"` : "";
            html.push(`<h${level}${idAttribute}>${renderInline(headingLabel, baseDir)}</h${level}>`);
            continue;
          }

          const imageMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
          if (imageMatch) {
            closeAllOpenBlocks();
            const alt = escapeHtml(imageMatch[1]);
            const src = escapeHtml(resolvePath(imageMatch[2], baseDir));
            html.push(`
              <figure class="help-guide-figure">
                <img src="${src}" alt="${alt}" loading="lazy" />
                <figcaption>${alt}</figcaption>
              </figure>
            `);
            continue;
          }

          const orderedMatch = line.match(/^\d+\.\s+(.+)$/);
          if (orderedMatch) {
            flushParagraph();
            flushBlockquote();
            flushTable();
            if (listType !== "ol") {
              closeList();
              html.push("<ol>");
              listType = "ol";
            }
            pendingDefinitionTerm = null;
            html.push(`<li>${renderInline(orderedMatch[1], baseDir)}</li>`);
            continue;
          }

          const unorderedMatch = line.match(/^[-*]\s+(.+)$/);
          if (unorderedMatch) {
            flushParagraph();
            flushBlockquote();
            flushTable();
            if (listType !== "ul") {
              closeList();
              html.push("<ul>");
              listType = "ul";
            }
            pendingDefinitionTerm = null;
            html.push(`<li>${renderTaskListItem(unorderedMatch[1], baseDir)}</li>`);
            continue;
          }

          if (line === "---") {
            closeAllOpenBlocks();
            html.push("<hr />");
            continue;
          }

          closeList();
          flushBlockquote();
          flushTable();

          if (!paragraphBuffer.length && !pendingDefinitionTerm) {
            pendingDefinitionTerm = line;
          } else {
            paragraphBuffer.push(line);
          }
        }

        closeAllOpenBlocks();
        if (codeFenceLanguage !== null) {
          html.push(renderCodeBlock(codeFenceLines, codeFenceLanguage));
        }

        if (footnotes.length) {
          html.push('<section class="md-footnotes"><hr /><ol>');
          for (const note of footnotes) {
            const safeId = escapeHtml(note.id);
            html.push(`<li id="fn-${safeId}">${renderInline(note.text, baseDir)} <a href="#fnref-${safeId}" aria-label="Back to content">↩</a></li>`);
          }
          html.push("</ol></section>");
        }

        return html.join("\n");
      }

      function getRequestedPageId() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get("page");
        if (requested && pagesById.has(requested)) return requested;
        return tocSections[0].pages[0].id;
      }

      function renderToc(activePageId) {
        helpGuideToc.innerHTML = `
          <h2>Help Pages</h2>
          ${tocSections.map((section) => {
            const sectionHasActivePage = section.pages.some((page) => page.id === activePageId || (Array.isArray(page.children) && page.children.some((child) => child.id === activePageId)));
            return `
            <section class="toc-section ${sectionHasActivePage ? "" : "is-collapsed"}">
              <button type="button" class="toc-section-header" aria-expanded="${sectionHasActivePage ? "true" : "false"}">
                <h3 class="toc-section-title">${section.sectionTitle}</h3>
                <span class="toc-section-chevron" aria-hidden="true">▾</span>
              </button>
              <div class="toc-section-body">
                <div class="toc-links">
                ${section.pages.map((page) => {
                  const activeClass = page.id === activePageId ? "is-active" : "";
                  const childLinks = Array.isArray(page.children) && page.children.length
                    ? `<div class="toc-sub-links">${page.children.map((child) => {
                      const childActiveClass = child.id === activePageId ? "is-active" : "";
                      return `<a class="toc-link toc-sub-link ${childActiveClass}" href="/user-guide.html?page=${child.id}">${child.title}</a>`;
                    }).join("")}</div>`
                    : "";
                  return `<a class="toc-link ${activeClass}" href="/user-guide.html?page=${page.id}">${page.title}</a>${childLinks}`;
                }).join("")}
                </div>
              </div>
            </section>
          `;
          }).join("")}
        `;

        helpGuideToc.querySelectorAll(".toc-section-header").forEach((header) => {
          header.addEventListener("click", () => {
            const section = header.closest(".toc-section");
            if (!section) return;
            section.classList.toggle("is-collapsed");
            const expanded = !section.classList.contains("is-collapsed");
            header.setAttribute("aria-expanded", expanded ? "true" : "false");
          });
        });
      }

      async function loadPage(pageId) {
        const page = pagesById.get(pageId);
        if (!page) return;
        renderToc(pageId);
        helpGuidePageLabel.textContent = `Viewing: ${page.title}`;
        helpGuideStatus.textContent = `Loaded page ${page.title}`;

        try {
          const response = await fetch(`${HELP_PAGES_BASE}/${page.file}`, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Unable to load ${page.file}`);
          }
          const markdown = await response.text();
          helpGuideArticle.innerHTML = markdownToHtml(markdown, page.file);
        } catch (error) {
          helpGuideArticle.innerHTML = `<p>Failed to load help page.</p><p><code>${escapeHtml(String(error.message || error))}</code></p>`;
        }
      }

      loadPage(getRequestedPageId());
    </script>
  </body>
</html>
