<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC Hub · Help Guide</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="icon" href="/img/dcc_black_logo.png" type="image/png" />
    <script src="/theme.js"></script>
    <style>
      .help-guide-page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 18px 20px 44px;
      }

      .help-guide-topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .help-guide-layout {
        display: grid;
        grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
        gap: 24px;
      }

      .help-guide-toc {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-soft);
        padding: 14px;
        align-self: start;
        position: sticky;
        top: 12px;
      }

      .help-guide-toc h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .toc-section + .toc-section {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .toc-section-title {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
      }

      .toc-links {
        display: grid;
        gap: 6px;
      }

      .toc-sub-links {
        display: grid;
        gap: 5px;
        margin: 2px 0 8px 14px;
        padding-left: 10px;
        border-left: 1px solid var(--border);
      }

      .toc-link {
        display: block;
        color: var(--text);
        text-decoration: none;
        border-radius: 8px;
        padding: 8px 10px;
      }

      .toc-link:hover,
      .toc-link:focus-visible {
        background: var(--surface-hover);
        outline: none;
      }

      .toc-link.is-active {
        background: var(--surface-hover);
        border: 1px solid var(--border);
        padding: 7px 9px;
      }

      .toc-sub-link {
        font-size: 0.92rem;
      }

      .help-guide-content {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-soft);
        padding: 20px;
        min-height: 520px;
      }

      .help-guide-status {
        margin-top: 0;
        margin-bottom: 12px;
        color: var(--muted);
      }

      .md-content h1,
      .md-content h2,
      .md-content h3 {
        margin-top: 24px;
        margin-bottom: 10px;
      }

      .md-content h1 {
        margin-top: 0;
      }

      .md-content p,
      .md-content ul,
      .md-content ol {
        margin-top: 0;
        margin-bottom: 12px;
        line-height: 1.5;
      }

      .md-content ul,
      .md-content ol {
        padding-left: 20px;
      }

      .md-content code {
        background: var(--surface-hover);
        border-radius: 6px;
        padding: 2px 6px;
      }

      .md-inline-quoted {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface-hover) 86%, white 14%);
        color: var(--text);
        border: 1px solid color-mix(in srgb, var(--border) 70%, white 30%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.93em;
      }

      .md-content pre {
        margin: 0 0 14px;
      }

      .md-code-block {
        background: #0b0f17;
        border: 1px solid #232a36;
        border-radius: 10px;
        padding: 12px 14px;
        overflow-x: auto;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .md-code-block code {
        display: block;
        background: transparent;
        border-radius: 0;
        padding: 0;
        white-space: pre;
        color: #d7dde6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      .md-code-key {
        color: #e06c75;
      }

      .md-code-string {
        color: #98c379;
      }

      .md-code-number,
      .md-code-boolean {
        color: #d19a66;
      }

      .md-code-comment {
        color: #7f848e;
      }

      .help-guide-figure {
        margin: 14px 0;
      }

      .help-guide-figure img {
        display: block;
        width: 100%;
        max-width: 1000px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
      }

      .help-guide-figure figcaption {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 980px) {
        .help-guide-layout {
          grid-template-columns: 1fr;
        }

        .help-guide-toc {
          position: static;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="help-guide-page">
      <div class="help-guide-topbar">
        <a class="btn" href="/">← Back to Hub</a>
        <span class="sr-only" aria-live="polite" id="helpGuideStatus"></span>
      </div>

      <div class="help-guide-layout">
        <nav class="help-guide-toc" aria-label="Help guide table of contents" id="helpGuideToc"></nav>
        <section class="help-guide-content">
          <p class="help-guide-status" id="helpGuidePageLabel">Loading help page…</p>
          <article id="helpGuideArticle" class="md-content"></article>
        </section>
      </div>
    </main>

    <script>
      const HELP_PAGES_BASE = "/help/user-guide/pages";
      const helpGuideStatus = document.getElementById("helpGuideStatus");
      const helpGuideToc = document.getElementById("helpGuideToc");
      const helpGuidePageLabel = document.getElementById("helpGuidePageLabel");
      const helpGuideArticle = document.getElementById("helpGuideArticle");

      const tocSections = [
        {
          sectionTitle: "Start Here",
          pages: [
            {
              id: "what-is-continue-and-dcc",
              title: "What is Continue.dev and DCC",
              file: "what-is-continue-and-dcc.md"
            }
          ]
        },
        {
          sectionTitle: "Install",
          pages: [
            {
              id: "install-continue-extension-to-ide",
              title: "Install Continue Extension to IDE",
              file: "install-continue-extension-to-ide.md"
            }
          ]
        },
        {
          sectionTitle: "Settings",
          pages: [
            {
              id: "add-ai-assets-repo",
              title: "Add AI Assets repo",
              file: "settings/add-ai-assets-repo.md"
            },
            {
              id: "add-development-project-roots",
              title: "Add Development Project Roots",
              file: "settings/add-development-project-roots.md"
            }
          ]
        },
        {
          sectionTitle: "Usage",
          pages: [
            {
              id: "search-filter-definitions",
              title: "Search & Filter definitions",
              file: "usage/search-filter-definitions.md"
            },
            {
              id: "inspect-definition",
              title: "Inspect Definition",
              file: "usage/inspect-definition.md"
            },
            {
              id: "definition-details-actions",
              title: "Definition Details Actions",
              file: "usage/definition-details-actions.md",
              children: [
                {
                  id: "definition-details-actions-navigation-and-view-controls",
                  title: "Navigation and View Controls",
                  file: "usage/definition-details-actions-navigation-and-view-controls.md"
                },
                {
                  id: "definition-details-actions-action-buttons",
                  title: "Definition Action Buttons",
                  file: "usage/definition-details-actions-action-buttons.md"
                },
                {
                  id: "definition-details-actions-source",
                  title: "Source Tab Actions",
                  file: "usage/definition-details-actions-source.md"
                },
                {
                  id: "definition-details-actions-test",
                  title: "Test Tab Actions",
                  file: "usage/definition-details-actions-test.md"
                },
                {
                  id: "definition-details-actions-test-schema-common",
                  title: "Test Schema: Common Fields",
                  file: "usage/definition-details-actions-test-schema-common.md"
                },
                {
                  id: "definition-details-actions-test-schema-rule",
                  title: "Test Schema: Rule Structure",
                  file: "usage/definition-details-actions-test-schema-rule.md"
                },
                {
                  id: "definition-details-actions-test-schema-prompt",
                  title: "Test Schema: Prompt Structure",
                  file: "usage/definition-details-actions-test-schema-prompt.md"
                },
                {
                  id: "definition-details-actions-test-schema-workflow",
                  title: "Test Schema: Workflow Structure",
                  file: "usage/definition-details-actions-test-schema-workflow.md"
                },
                {
                  id: "definition-details-actions-test-schema-agent",
                  title: "Test Schema: Agent Structure",
                  file: "usage/definition-details-actions-test-schema-agent.md"
                },
                {
                  id: "definition-details-actions-test-schema-model",
                  title: "Test Schema: Model Structure",
                  file: "usage/definition-details-actions-test-schema-model.md"
                },
                {
                  id: "definition-details-actions-test-schema-context",
                  title: "Test Schema: Context Structure",
                  file: "usage/definition-details-actions-test-schema-context.md"
                },
                {
                  id: "definition-details-actions-test-schema-mcpserver",
                  title: "Test Schema: MCP Server Structure",
                  file: "usage/definition-details-actions-test-schema-mcpserver.md"
                },
                {
                  id: "definition-details-actions-test-schema-config",
                  title: "Test Schema: Config Structure",
                  file: "usage/definition-details-actions-test-schema-config.md"
                },
                {
                  id: "definition-details-actions-test-schema-docs",
                  title: "Test Schema: Docs Structure",
                  file: "usage/definition-details-actions-test-schema-docs.md"
                }
              ]
            },
            {
              id: "edit-definition",
              title: "Edit Definition",
              file: "usage/edit-definition.md"
            },
            {
              id: "create-new-definition",
              title: "Create new Definition",
              file: "usage/create-new-definition.md"
            },
            {
              id: "install-definition-into-project",
              title: "Install Definition into Project",
              file: "usage/install-definition-into-project.md"
            }
          ]
        }
      ];

      const pagesById = new Map(
        tocSections.flatMap((section) => section.pages.flatMap((page) => {
          const pageEntries = [[page.id, page]];
          if (Array.isArray(page.children)) {
            pageEntries.push(...page.children.map((child) => [child.id, child]));
          }
          return pageEntries;
        }))
      );

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderInline(text, baseDir) {
        const escaped = escapeHtml(text);
        const withCode = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
        const withQuotedToken = withCode.replace(
          /(^|[\s(])&#39;([^<>&\n]+?)&#39;(?=$|[\s).,:;!?])/g,
          '$1<span class="md-inline-quoted">$2</span>'
        );
        const withBold = withQuotedToken.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        const withItalic = withBold.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        return withItalic.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
          const resolved = resolvePath(href, baseDir);
          const safeHref = escapeHtml(resolved);
          return `<a href="${safeHref}" target="_blank" rel="noopener">${label}</a>`;
        });
      }

      function resolvePath(pathValue, baseDir) {
        if (/^(https?:)?\/\//.test(pathValue) || pathValue.startsWith("/")) {
          return pathValue;
        }
        const normalizedBase = baseDir.endsWith("/") ? baseDir.slice(0, -1) : baseDir;
        return `${normalizedBase}/${pathValue}`;
      }

      function highlightCode(source, language) {
        const escaped = escapeHtml(source);
        if (!["yaml", "yml", "json"].includes((language || "").toLowerCase())) {
          return escaped;
        }

        return escaped
          .replace(/(^|\s)(true|false|null)(?=\s|$|[\],}])/gm, "$1<span class=\"md-code-boolean\">$2</span>")
          .replace(/(^|\s)(-?\d+(?:\.\d+)?)(?=\s|$|[\],}])/gm, "$1<span class=\"md-code-number\">$2</span>")
          .replace(/("(?:\\.|[^"])*"|'(?:\\.|[^'])*')/g, "<span class=\"md-code-string\">$1</span>")
          .replace(/(^\s*#.*$)/gm, "<span class=\"md-code-comment\">$1</span>")
          .replace(/(^\s*[\w.-]+)(\s*:)/gm, "<span class=\"md-code-key\">$1</span>$2");
      }

      function renderCodeBlock(codeLines, language) {
        const lang = escapeHtml((language || "").toLowerCase());
        const source = codeLines.join("\n");
        const highlighted = highlightCode(source, language);
        return `<pre class="md-code-block"><code class="language-${lang}">${highlighted}</code></pre>`;
      }

      function markdownToHtml(markdown, markdownPath) {
        const baseDir = markdownPath.includes("/")
          ? `${HELP_PAGES_BASE}/${markdownPath.slice(0, markdownPath.lastIndexOf("/"))}`
          : HELP_PAGES_BASE;

        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let paragraphBuffer = [];
        let listType = null;
        let codeFenceLanguage = null;
        let codeFenceLines = [];

        function flushParagraph() {
          if (!paragraphBuffer.length) return;
          const paragraphText = paragraphBuffer.join(" ").trim();
          if (paragraphText) {
            html.push(`<p>${renderInline(paragraphText, baseDir)}</p>`);
          }
          paragraphBuffer = [];
        }

        function closeList() {
          if (!listType) return;
          html.push(listType === "ol" ? "</ol>" : "</ul>");
          listType = null;
        }

        for (const rawLine of lines) {
          const line = rawLine.trim();

          if (codeFenceLanguage !== null) {
            if (line.startsWith("```")) {
              html.push(renderCodeBlock(codeFenceLines, codeFenceLanguage));
              codeFenceLanguage = null;
              codeFenceLines = [];
            } else {
              codeFenceLines.push(rawLine);
            }
            continue;
          }

          const codeFenceMatch = line.match(/^```\s*([\w-]+)?\s*$/);
          if (codeFenceMatch) {
            flushParagraph();
            closeList();
            codeFenceLanguage = codeFenceMatch[1] || "";
            codeFenceLines = [];
            continue;
          }

          if (!line) {
            flushParagraph();
            closeList();
            continue;
          }

          const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
          if (headingMatch) {
            flushParagraph();
            closeList();
            const level = headingMatch[1].length;
            html.push(`<h${level}>${renderInline(headingMatch[2], baseDir)}</h${level}>`);
            continue;
          }

          const imageMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
          if (imageMatch) {
            flushParagraph();
            closeList();
            const alt = escapeHtml(imageMatch[1]);
            const src = escapeHtml(resolvePath(imageMatch[2], baseDir));
            html.push(`
              <figure class="help-guide-figure">
                <img src="${src}" alt="${alt}" loading="lazy" />
                <figcaption>${alt}</figcaption>
              </figure>
            `);
            continue;
          }

          const orderedMatch = line.match(/^\d+\.\s+(.+)$/);
          if (orderedMatch) {
            flushParagraph();
            if (listType !== "ol") {
              closeList();
              html.push("<ol>");
              listType = "ol";
            }
            html.push(`<li>${renderInline(orderedMatch[1], baseDir)}</li>`);
            continue;
          }

          const unorderedMatch = line.match(/^[-*]\s+(.+)$/);
          if (unorderedMatch) {
            flushParagraph();
            if (listType !== "ul") {
              closeList();
              html.push("<ul>");
              listType = "ul";
            }
            html.push(`<li>${renderInline(unorderedMatch[1], baseDir)}</li>`);
            continue;
          }

          paragraphBuffer.push(line);
        }

        flushParagraph();
        closeList();
        if (codeFenceLanguage !== null) {
          html.push(renderCodeBlock(codeFenceLines, codeFenceLanguage));
        }
        return html.join("\n");
      }

      function getRequestedPageId() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get("page");
        if (requested && pagesById.has(requested)) return requested;
        return tocSections[0].pages[0].id;
      }

      function renderToc(activePageId) {
        helpGuideToc.innerHTML = `
          <h2>Help Pages</h2>
          ${tocSections.map((section) => `
            <section class="toc-section">
              <h3 class="toc-section-title">${section.sectionTitle}</h3>
              <div class="toc-links">
                ${section.pages.map((page) => {
                  const activeClass = page.id === activePageId ? "is-active" : "";
                  const childLinks = Array.isArray(page.children) && page.children.length
                    ? `<div class="toc-sub-links">${page.children.map((child) => {
                      const childActiveClass = child.id === activePageId ? "is-active" : "";
                      return `<a class="toc-link toc-sub-link ${childActiveClass}" href="/user-guide.html?page=${child.id}">${child.title}</a>`;
                    }).join("")}</div>`
                    : "";
                  return `<a class="toc-link ${activeClass}" href="/user-guide.html?page=${page.id}">${page.title}</a>${childLinks}`;
                }).join("")}
              </div>
            </section>
          `).join("")}
        `;
      }

      async function loadPage(pageId) {
        const page = pagesById.get(pageId);
        if (!page) return;
        renderToc(pageId);
        helpGuidePageLabel.textContent = `Viewing: ${page.title}`;
        helpGuideStatus.textContent = `Loaded page ${page.title}`;

        try {
          const response = await fetch(`${HELP_PAGES_BASE}/${page.file}`, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Unable to load ${page.file}`);
          }
          const markdown = await response.text();
          helpGuideArticle.innerHTML = markdownToHtml(markdown, page.file);
        } catch (error) {
          helpGuideArticle.innerHTML = `<p>Failed to load help page.</p><p><code>${escapeHtml(String(error.message || error))}</code></p>`;
        }
      }

      loadPage(getRequestedPageId());
    </script>
  </body>
</html>
