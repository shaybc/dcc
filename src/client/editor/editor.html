<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Definition Editor</title>
    <link rel="stylesheet" href="/editor/editor.css" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <header class="editor-top">
      <h1 id="editorTitle">Definition Editor</h1>
      <div class="editor-actions">
        <button id="cancelButton" class="btn" type="button">Cancel</button>
        <button id="saveButton" class="btn btn-primary" type="button">Save</button>
      </div>
    </header>
    <main class="editor-main">
      <section>
        <h3>Structured Form</h3>
        <div id="formMount"></div>
      </section>
      <section>
        <h3 id="rawLabel">Raw YAML</h3>
        <div id="parseError" class="error" hidden></div>
        <textarea id="rawText" rows="30"></textarea>
      </section>
    </main>
    <script type="module" src="/editor/editor.js"></script>
  
    <div id="loadingOverlay" class="loading-overlay hidden" aria-live="polite" aria-busy="false" aria-hidden="true">
      <div class="loading-content" role="status">
        <div class="loading-spinner" aria-hidden="true">
          <svg class="spinner-icon" viewBox="0 0 50 50">
            <circle class="spinner-path" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
          </svg>
        </div>
        <div class="loading-message">
          <h3 id="loadingTitle">Processing...</h3>
          <p id="loadingDescription" class="loading-description"></p>
        </div>
        <div id="loadingProgress" class="loading-progress hidden">
          <div class="progress-bar"><div class="progress-fill"></div></div>
          <span class="progress-text">0%</span>
        </div>
        <div id="loadingTimeoutWarning" class="loading-timeout-warning hidden">
          <p>This is taking longer than expected...</p>
          <button class="btn btn-sm" id="extendTimeoutBtn" type="button">Wait Longer</button>
          <button class="btn btn-sm" id="cancelOperationBtn" type="button">Cancel</button>
        </div>
        <div id="loadingError" class="loading-error hidden" aria-live="assertive">
          <svg class="error-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"></circle>
            <path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2"></path>
          </svg>
          <h3>Operation Failed</h3>
          <p id="loadingErrorMessage"></p>
          <div class="error-actions">
            <button class="btn btn-primary" id="retryOperationBtn" type="button">Retry</button>
            <button class="btn" id="dismissErrorBtn" type="button">Dismiss</button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
