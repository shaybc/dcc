<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Definition Details · DCC Hub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-left"></div>
      <div class="title-block">
        <div class="main-title">
          <img src="img/dcc_white_logo.png" width="10%">
          <h1>Developer Control Center</h1>
        </div>
        <p>Definition details</p>
      </div>
      <div class="actions">
        <a class="btn" href="/">← Back to hub</a>
      </div>
    </header>

    <main class="definition-page-main">
      <section class="definition-page-shell">
        <div class="modal-topbar">
          <div class="modal-kicker">Definition details</div>
        </div>
        <div class="detail-hero">
          <div class="detail-hero-icon" id="detailTypeIcon" aria-hidden="true"></div>
          <div class="detail-hero-content">
            <div class="detail-hero-meta-row">
              <div class="detail-hero-type">
                <span class="detail-hero-type-icon" id="detailTypeMetaIcon" aria-hidden="true"></span>
                <span id="detailTypeText"></span>
              </div>
              <div class="detail-hero-date" id="detailCreatedDate"></div>
            </div>
            <h2 id="detailTitle"></h2>
            <div class="detail-description" id="detailDescription"></div>
            <div class="status-pill" id="detailStatus"></div>
          </div>
        </div>
        <div class="definition-tabs" id="definitionTabs">
          <div class="definition-tabs-header">
            <div class="definition-tab-buttons" role="tablist" aria-label="Definition view tabs">
              <button class="definition-tab" id="definitionTabPreview" type="button" role="tab" aria-selected="false">Preview</button>
              <button class="definition-tab active" id="definitionTabSource" type="button" role="tab" aria-selected="true"></button>
            </div>
            <button class="copy-btn" id="copyDefinition" type="button" aria-label="Copy definition" title="Copy definition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              </svg>
            </button>
          </div>
          <div class="definition-tab-panel" id="definitionPreviewPanel" role="tabpanel" aria-labelledby="definitionTabPreview" hidden>
            <div class="detail-description definition-preview-content" id="definitionPreviewContent"></div>
          </div>
          <div class="definition-tab-panel active" id="definitionSourcePanel" role="tabpanel" aria-labelledby="definitionTabSource">
            <pre id="detailContent"></pre>
          </div>
        </div>
      </section>
    </main>

    <script src="/definition.js"></script>
  </body>
</html>
