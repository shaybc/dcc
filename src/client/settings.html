<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Settings</h1>
        <p>Configure your AI assets repository and sync definitions.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/">← Back to Hub</a>
      </div>
    </header>
    <main>
      <form class="settings-form" id="settingsForm">
        <label for="repoUrl">AI Assets Git Repo URL</label>
        <input id="repoUrl" name="repoUrl" type="text" placeholder="https://github.com/your-org/ai_assets" />

        <label for="repoPath">Clone Path on Disk</label>
        <input id="repoPath" name="repoPath" type="text" placeholder="/Users/you/ai_assets" />

        <div class="row">
          <button class="btn btn-primary" type="submit">Save settings</button>
          <button class="btn" type="button" id="clonePull">Clone / Pull Repo</button>
          <button class="btn" type="button" id="loadDefinitions">Load Definitions</button>
        </div>
        <p class="notice" id="settingsNotice"></p>
      </form>

      <section class="settings-section">
        <h2>Development Project Roots</h2>
        <p class="helper-text">Add folders that contain development projects. Changes trigger a rescan.</p>
        <div class="table-actions">
          <button class="btn btn-primary" type="button" id="addDevRoot">Add root</button>
          <button class="btn" type="button" id="saveDevRoots">Save &amp; rescan projects</button>
        </div>
        <table class="settings-table" aria-label="Development project roots">
          <thead>
            <tr>
              <th>Folder path</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="devRootsTable"></tbody>
        </table>
        <input id="devRootPicker" type="file" webkitdirectory hidden />
        <p class="notice" id="devRootsNotice"></p>
      </section>

      <section class="settings-section">
        <h2>Detected Dev Projects</h2>
        <p class="helper-text">Read-only list of git projects found under your roots.</p>
        <table class="settings-table" aria-label="Detected dev projects">
          <thead>
            <tr>
              <th>Project path</th>
            </tr>
          </thead>
          <tbody id="devProjectsTable"></tbody>
        </table>
      </section>
    </main>

    <script src="/settings.js"></script>
  </body>
</html>
