<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Settings</h1>
        <p>Configure your AI assets repository and sync definitions.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/">← Back to Hub</a>
      </div>
    </header>
    <main>
      <form class="settings-form" id="settingsForm">
        <label for="repoUrl">AI Assets Git Repo URL</label>
        <input id="repoUrl" name="repoUrl" type="text" placeholder="https://github.com/your-org/ai_assets" />

        <label for="repoPath">Clone Path on Disk</label>
        <input id="repoPath" name="repoPath" type="text" placeholder="/Users/you/ai_assets" />

        <div class="row">
          <button class="btn btn-primary" type="submit">Save settings</button>
          <button class="btn" type="button" id="clonePull">Clone / Pull Repo</button>
          <button class="btn" type="button" id="loadDefinitions">Load Definitions</button>
        </div>
        <p class="notice" id="settingsNotice"></p>
      </form>
    </main>

    <script src="/settings.js"></script>
  </body>
</html>
