<main id="hubMain">
      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="search" type="search" placeholder="Search for models, prompts, rules, configs, MCP servers..." />
            <button class="icon-btn clear-search" id="clearSearch" type="button" aria-label="Clear search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <div class="filter-dropdown">
            <button class="filter-btn" id="filterButton" type="button" aria-expanded="false">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span>Filter</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
            </button>
            <div class="filter-menu" id="filterMenu" role="menu" aria-label="Filter definitions"></div>
          </div>
        </div>
        <div class="chips" id="filters"></div>
      </div>
      <p class="definitions-count-label" id="definitionsCountLabel" aria-live="polite"></p>
      <div class="grid" id="cards"></div>
      <nav class="pagination" id="pagination" role="navigation" aria-label="pagination" hidden></nav>
    </main>
