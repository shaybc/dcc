<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <header id="hubHeader">
      <div class="header-left">
        <div class="dev-project-picker">
          <label for="devProjectSelect">Dev project</label>
          <input
            id="devProjectSelect"
            name="devProjectSelect"
            type="text"
            list="devProjectOptions"
            placeholder="Select a dev project"
          />
          <datalist id="devProjectOptions"></datalist>
        </div>
      </div>
      <div class="title-block">
        <div class="main-title">
          <img src="img/dcc_white_logo.png" width="10%">
          <h1>Developer Control Center</h1>
        </div>
        <p>Discover, sync, and deploy Continue definitions from your team hub.</p>
      </div>
      <div class="actions">
        <div class="new-definition-menu-wrap">
          <button class="btn" id="newDefinitionMenuButton" type="button" aria-expanded="false">✚ New</button>
          <div class="new-definition-menu" id="newDefinitionMenu" hidden>
            <button type="button" data-definition-create="prompts">Create new Prompt</button>
            <button type="button" data-definition-create="mcp servers">Create new MCP Server</button>
            <button type="button" data-definition-create="agents">Create new Agent</button>
            <button type="button" data-definition-create="rules">Create new Rule</button>
            <button type="button" data-definition-create="models">Create new Model</button>
            <button type="button" data-definition-create="workflows">Create new Workflow</button>
            <button type="button" data-definition-create="context">Create new Context</button>
          </div>
        </div>
        <a class="btn" href="/settings">⚙ Settings</a>
      </div>
    </header>
    <main id="hubMain">
      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="search" type="search" placeholder="Search for models, prompts, rules, MCP servers..." />
            <button class="icon-btn clear-search" id="clearSearch" type="button" aria-label="Clear search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <div class="filter-dropdown">
            <button class="filter-btn" id="filterButton" type="button" aria-expanded="false">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span>Filter</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
            </button>
            <div class="filter-menu" id="filterMenu" role="menu" aria-label="Filter definitions"></div>
          </div>
        </div>
        <div class="chips" id="filters"></div>
      </div>
      <div class="grid" id="cards"></div>
    </main>

    <main class="detail-page" id="detailPage" aria-labelledby="detailTitle" hidden>
      <div class="detail-page-shell">
        <div class="detail-page-content">
          <div class="modal-topbar">
            <div class="modal-kicker">Definition details</div>
            <button class="btn" id="closeModal" type="button">Back to hub</button>
          </div>
          <div class="detail-hero">
            <div class="detail-hero-icon" id="detailTypeIcon" aria-hidden="true"></div>
            <div class="detail-hero-content">
              <div class="detail-hero-meta-row">
                <div class="detail-hero-type">
                  <span class="detail-hero-type-icon" id="detailTypeMetaIcon" aria-hidden="true"></span>
                  <span id="detailTypeText"></span>
                </div>
                <div class="detail-hero-date" id="detailCreatedDate"></div>
              </div>
              <div class="detail-tags" id="detailTags"></div>
              <h2 id="detailTitle"></h2>
              <div class="detail-description" id="detailDescription"></div>
              <div class="status-pill" id="detailStatus"></div>
            </div>
          </div>
          <div class="definition-tabs" id="definitionTabs">
            <div class="definition-tabs-header">
              <div class="definition-tab-buttons" role="tablist" aria-label="Definition view tabs">
                <button class="definition-tab" id="definitionTabPreview" type="button" role="tab" aria-selected="false">Preview</button>
                <button class="definition-tab active" id="definitionTabSource" type="button" role="tab" aria-selected="true"></button>
              </div>
              <div class="definition-actions">
                <button class="copy-btn" id="deleteDefinition" type="button" aria-label="Delete definition" title="Delete definition" hidden>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
                <button class="copy-btn" id="pushUpstreamDefinition" type="button" aria-label="Push definition to upstream" title="Push definition to upstream" hidden>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 19V5"></path>
                    <path d="m5 12 7-7 7 7"></path>
                  </svg>
                </button>
                <button class="copy-btn" id="duplicateDefinition" type="button" aria-label="Duplicate definition" title="Duplicate definition">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <rect x="2" y="2" width="13" height="13" rx="2"></rect>
                  </svg>
                </button>
                <button class="copy-btn" id="copyDefinition" type="button" aria-label="Copy definition" title="Copy definition">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  </svg>
                </button>
                <button class="copy-btn" id="editDefinition" type="button" aria-label="Edit definition" title="Edit definition">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="definition-tab-panel" id="definitionPreviewPanel" role="tabpanel" aria-labelledby="definitionTabPreview" hidden>
              <div class="detail-description definition-preview-content" id="definitionPreviewContent"></div>
            </div>
            <div class="definition-tab-panel active" id="definitionSourcePanel" role="tabpanel" aria-labelledby="definitionTabSource">
              <pre id="detailContent"></pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <main class="definition-form-page" id="definitionFormPage" hidden>
      <div class="detail-page-shell">
        <div class="detail-page-content">
          <div class="modal-topbar">
            <div class="modal-kicker" id="definitionFormTitle">Definition Form</div>
          </div>
          <div id="definitionFormContainer"></div>
        </div>
      </div>
    </main>

    <script src="/definition-form.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
