<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC Hub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="title-block">
        <h1>Developer Control Center</h1>
        <p>Discover, sync, and deploy Continue definitions from your team hub.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/settings">⚙ Settings</a>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="search" type="search" placeholder="Search definitions" />
            <button class="icon-btn clear-search" id="clearSearch" type="button" aria-label="Clear search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <div class="filter-dropdown">
            <button class="filter-btn" id="filterButton" type="button" aria-expanded="false">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span>Filter</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
            </button>
            <div class="filter-menu" id="filterMenu" role="menu" aria-label="Filter definitions"></div>
          </div>
        </div>
        <div class="chips" id="filters"></div>
      </div>
      <div class="grid" id="cards"></div>
    </main>

    <div class="modal" id="detailModal">
      <div class="modal-content">
        <button class="btn" id="closeModal">Close</button>
        <h2 id="detailTitle"></h2>
        <p id="detailDescription"></p>
        <div class="status-pill" id="detailStatus"></div>
        <h3>Definition</h3>
        <pre id="detailContent"></pre>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
